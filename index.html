<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Media Generator Suite & Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        code, pre { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-500/20">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                        AI Media Studio Pro
                    </h1>
                    <p class="text-[11px] text-slate-400">Generative Image, Speech Voice & Video Creation Suite</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button id="openApiModalBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl border border-slate-700 transition flex items-center gap-2">
                    <i class="fa-solid fa-key text-amber-400"></i>
                    <span class="hidden sm:inline">API Setup</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Studio Dashboard Container -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Sidebar Navigation (3 cols) -->
        <aside class="lg:col-span-3 space-y-4">
            <div class="glass-panel rounded-2xl p-3">
                <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-3 py-2">Generator Modules</div>
                <nav class="space-y-1">
                    <button data-module="image" class="nav-tab w-full flex items-center space-x-3 px-3 py-3 rounded-xl font-medium text-sm transition text-slate-400 hover:text-white hover:bg-slate-800/60 border border-transparent">
                        <div class="w-8 h-8 rounded-lg bg-blue-500/20 flex items-center justify-center text-blue-400">
                            <i class="fa-solid fa-image"></i>
                        </div>
                        <div class="text-left">
                            <div class="leading-none">Text-to-Image</div>
                            <span class="text-[10px] text-slate-400">Canvas Art</span>
                        </div>
                    </button>

                    <button data-module="voice" class="nav-tab w-full flex items-center space-x-3 px-3 py-3 rounded-xl font-medium text-sm transition text-slate-400 hover:text-white hover:bg-slate-800/60 border border-transparent">
                        <div class="w-8 h-8 rounded-lg bg-emerald-500/20 flex items-center justify-center text-emerald-400">
                            <i class="fa-solid fa-microphone-lines"></i>
                        </div>
                        <div class="text-left">
                            <div class="leading-none">Text-to-Speech</div>
                            <span class="text-[10px] text-slate-400">Real voice playback</span>
                        </div>
                    </button>

                    <button data-module="video" class="nav-tab w-full flex items-center space-x-3 px-3 py-3 rounded-xl font-medium text-sm transition text-white bg-purple-600/20 border border-purple-500/40">
                        <div class="w-8 h-8 rounded-lg bg-purple-500/20 flex items-center justify-center text-purple-400">
                            <i class="fa-solid fa-video"></i>
                        </div>
                        <div class="text-left">
                            <div class="leading-none">Text-to-Video</div>
                            <span class="text-[10px] text-slate-400">AI Motion & Replicate</span>
                        </div>
                    </button>
                </nav>
            </div>
        </aside>

        <!-- Main Workspace View (9 cols) -->
        <main class="lg:col-span-9">

            <!-- 1. IMAGE GENERATOR MODULE -->
            <section id="moduleImage" class="module-section space-y-6 hidden">
                <div class="glass-panel rounded-2xl p-5 space-y-4">
                    <h2 class="font-bold text-slate-100 flex items-center text-base">
                        <i class="fa-solid fa-image text-blue-400 mr-2"></i> Text-to-Image AI Generator
                    </h2>
                    <div>
                        <textarea id="imagePromptInput" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-100" placeholder="Describe the image..."></textarea>
                    </div>
                    <button id="generateImageBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-xl">Generate Image</button>
                </div>
                <div class="glass-panel rounded-2xl p-5">
                    <canvas id="artCanvas" width="800" height="500" class="w-full h-auto object-contain rounded-xl"></canvas>
                </div>
            </section>

            <!-- 2. VOICE GENERATOR MODULE -->
            <section id="moduleVoice" class="module-section space-y-6 hidden">
                <div class="glass-panel rounded-2xl p-5 space-y-4">
                    <h2 class="font-bold text-slate-100 flex items-center text-base">
                        <i class="fa-solid fa-microphone-lines text-emerald-400 mr-2"></i> Text-to-Speech Generator
                    </h2>
                    <textarea id="voiceTextInput" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-100" placeholder="Enter script..."></textarea>
                    <button id="playVoiceBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl">Speak Script</button>
                </div>
            </section>

            <!-- 3. VIDEO GENERATOR MODULE (CONNECTED TO SERVER) -->
            <section id="moduleVideo" class="module-section space-y-6">
                <div class="glass-panel rounded-2xl p-5 space-y-4">
                    <h2 class="font-bold text-slate-100 flex items-center text-base">
                        <i class="fa-solid fa-video text-purple-400 mr-2"></i> Text-to-Video AI Generator
                    </h2>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Prompt Input</label>
                        <textarea id="videoPromptInput" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-100 placeholder-slate-500" placeholder="A cinematic drone shot of futuristic city..."></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Image URL (Optional)</label>
                        <input type="text" id="videoImageUrlInput" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100" placeholder="https://example.com/image.jpg">
                    </div>

                    <button id="generateVideoBtn" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-clapperboard"></i>
                        <span>Generate AI Video</span>
                    </button>
                </div>

                <!-- Video Preview Box -->
                <div class="glass-panel rounded-2xl p-5 space-y-4">
                    <h3 class="font-semibold text-sm text-slate-200">Video Output</h3>
                    <div id="videoContainer" class="relative bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-center min-h-[350px]">
                        <p id="videoPlaceholder" class="text-xs text-slate-500">Your generated video will appear here...</p>
                        <video id="outputVideo" controls class="w-full max-h-[450px] rounded-xl hidden"></video>
                        <div id="videoLoader" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur flex flex-col items-center justify-center space-y-3">
                            <div class="w-10 h-10 border-4 border-purple-500/30 border-t-purple-500 rounded-full animate-spin"></div>
                            <p class="text-xs font-medium text-slate-300">Rendering AI Video... Please wait 1-2 minutes.</p>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toastNotification" class="fixed bottom-5 right-5 bg-slate-900 border border-blue-500/40 text-slate-200 px-4 py-3 rounded-xl hidden z-50 flex items-center space-x-2 text-xs">
        <span id="toastMsg">Notification</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // Tab navigation
            const navTabs = document.querySelectorAll('.nav-tab');
            const modules = {
                image: document.getElementById('moduleImage'),
                voice: document.getElementById('moduleVoice'),
                video: document.getElementById('moduleVideo')
            };

            navTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const target = tab.getAttribute('data-module');
                    Object.keys(modules).forEach(key => {
                        if (key === target) modules[key].classList.remove('hidden');
                        else modules[key].classList.add('hidden');
                    });
                });
            });

            // Video Generation Backend Call
            const generateVideoBtn = document.getElementById('generateVideoBtn');
            const videoPromptInput = document.getElementById('videoPromptInput');
            const videoImageUrlInput = document.getElementById('videoImageUrlInput');
            const videoLoader = document.getElementById('videoLoader');
            const outputVideo = document.getElementById('outputVideo');
            const videoPlaceholder = document.getElementById('videoPlaceholder');

            generateVideoBtn.addEventListener('click', async () => {
                const prompt = videoPromptInput.value.trim();
                const imageUrl = videoImageUrlInput.value.trim();

                if (!prompt) return alert('Please enter a video prompt!');

                videoLoader.classList.remove('hidden');
                videoPlaceholder.classList.add('hidden');
                outputVideo.classList.add('hidden');

                try {
                    const response = await fetch('/api/generate-video', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt, imageUrl })
                    });

                    const data = await response.json();

                    if (data.success && data.videoUrl) {
                        outputVideo.src = data.videoUrl;
                        outputVideo.classList.remove('hidden');
                        outputVideo.play();
                    } else {
                        alert("Error: " + (data.message || "Failed to generate video"));
                        videoPlaceholder.classList.remove('hidden');
                    }
                } catch (err) {
                    alert("Backend Error: Could not connect to server!");
                    videoPlaceholder.classList.remove('hidden');
                } finally {
                    videoLoader.classList.add('hidden');
                }
            });

            // Voice Speech Setup
            document.getElementById('playVoiceBtn').addEventListener('click', () => {
                const text = document.getElementById('voiceTextInput').value;
                if (!text) return alert('Enter speech script!');
                const utterance = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utterance);
            });
        });
    </script>
</body>
</html>
